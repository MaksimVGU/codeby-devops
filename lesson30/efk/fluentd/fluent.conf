<source>
  @type forward
  port 24224
  bind 0.0.0.0
</source>

<filter service.post>
  @type parser
  key_name log
  reserve_data true
  remove_key_name_field true
  emit_invalid_record_to_error false
  <parse>
    @type json
  </parse>
</filter>

<match service.ui>
  @type copy
  copy_mode deep
  <store>
    @type relabel
    @label @ui_regexp
  </store>
  <store>
    @type relabel
    @label @ui_grok
  </store>
  <store>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix ui-raw
    suppress_type_name true
    <buffer>
      flush_interval 1s
    </buffer>
  </store>
</match>

<match service.post>
  @type elasticsearch
  host elasticsearch
  port 9200
  logstash_format true
  logstash_prefix post
  suppress_type_name true
  reload_connections false
  <buffer>
    flush_interval 1s
  </buffer>
</match>

<label @ui_regexp>
  <filter service.ui>
    @type parser
    key_name log
    reserve_data true
    remove_key_name_field true
    emit_invalid_record_to_error false
    <parse>
      @type regexp
      expression /^[A-Z],\s+\[(?<log_time>\S+)\s+\S+\]\s+(?<level>[A-Z]+)\s+--\s+:\s+service=(?<service>\S+)\s+\|\s+event=(?<event>\S+)(?:\s+\|\s+path=(?<path>\S+))?\s+\|\s+request_id=(?<request_id>\S+)(?:\s+\|\s+remote_addr=(?<remote_addr>\S+))?(?:\s+\|\s+method=\s*(?<method>\S+))?(?:\s+\|\s+response_status=(?<response_status>\d+))?(?:\s+\|\s+message='(?<message>.*?)')?(?:\s+\|\s+params:\s*(?<params>.*))?\s*$/
    </parse>
  </filter>

  <match service.ui>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix ui-regexp
    suppress_type_name true
    reload_connections false
    <buffer>
      flush_interval 1s
    </buffer>
  </match>
</label>

<label @ui_grok>
  <filter service.ui>
    @type parser
    key_name log
    reserve_data true
    remove_key_name_field true
    emit_invalid_record_to_error false
    <parse>
      @type grok
      grok_pattern '^[A-Z],\s+\[%{TIMESTAMP_ISO8601:log_time}\s+\S+\]\s+%{WORD:level}\s+--\s+:\s+service=%{WORD:service}\s+\|\s+event=%{WORD:event}\s+\|\s+path=%{NOTSPACE:path}\s+\|\s+request_id=%{UUID:request_id}\s+\|\s+remote_addr=%{IP:remote_addr}\s+\|\s+method=\s*%{WORD:method}\s+\|\s+response_status=%{INT:response_status}\s*$'
    </parse>
  </filter>

  <match service.ui>
    @type elasticsearch
    host elasticsearch
    port 9200
    logstash_format true
    logstash_prefix ui-grok
    suppress_type_name true
    reload_connections false
    <buffer>
      flush_interval 1s
    </buffer>
  </match>
</label>
