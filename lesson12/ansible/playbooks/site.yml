---
- name: Configure hosts
  hosts: all
  become: true

  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name:
          - wget
          - htop
          - nginx
        state: present
        update_cache: true

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        state: started
        enabled: true

    - name: Show environment
      ansible.builtin.debug:
        msg: "This host is in {{ group_names[0] }} environment"
