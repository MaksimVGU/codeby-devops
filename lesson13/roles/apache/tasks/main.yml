- name: Install Apache and PHP packages on Debian
  ansible.builtin.apt:
    name:
      - apache2
      - libapache2-mod-php
      - php
      - php-mysql
      - php-gd
      - php-xml
      - php-mbstring
      - php-curl
      - php-zip
      - php-opcache
      - unzip
      - curl
    state: present
    update_cache: true
  when: ansible_facts.os_family == 'Debian'

- name: Install Apache and PHP packages on RedHat
  ansible.builtin.dnf:
    name:
      - httpd
      - php
      - php-mysqlnd
      - php-gd
      - php-xml
      - php-mbstring
      - php-curl
      - php-zip
      - php-opcache
      - unzip
      - curl
    state: present
  when: ansible_facts.os_family == 'RedHat'

- name: Start Apache
  ansible.builtin.service:
    name: "{{ apache_service_name }}"
    state: started
    enabled: true

- name: Allow HTTP on Ubuntu
  ansible.builtin.ufw:
    rule: allow
    port: '80'
    proto: tcp
  when: ansible_facts.os_family == 'Debian'

- name: Allow HTTP on RedHat
  ansible.posix.firewalld:
    port: 80/tcp
    permanent: true
    immediate: true
    state: enabled
  when: ansible_facts.os_family == 'RedHat'

- name: Enable rewrite module on Debian
  ansible.builtin.command:
    cmd: a2enmod rewrite
    creates: /etc/apache2/mods-enabled/rewrite.load
  when: ansible_facts.os_family == 'Debian'
  notify: Restart Apache

- name: Create WordPress directory
  ansible.builtin.file:
    path: "{{ wordpress_install_dir }}"
    state: directory
    owner: "{{ wordpress_owner }}"
    group: "{{ wordpress_group }}"
    mode: '0755'

- name: Download WordPress
  ansible.builtin.get_url:
    url: "{{ wordpress_download_url }}"
    dest: /tmp/wordpress.tar.gz
    mode: '0644'

- name: Extract WordPress
  ansible.builtin.unarchive:
    src: /tmp/wordpress.tar.gz
    dest: "{{ wordpress_install_dir }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    owner: "{{ wordpress_owner }}"
    group: "{{ wordpress_group }}"
    creates: "{{ wordpress_install_dir }}/wp-admin"

- name: Create wp-config.php
  ansible.builtin.template:
    src: wp-config.php.j2
    dest: "{{ wordpress_install_dir }}/wp-config.php"
    owner: "{{ wordpress_owner }}"
    group: "{{ wordpress_group }}"
    mode: '0640'
  notify: Restart Apache

- name: Configure Apache on Debian
  ansible.builtin.template:
    src: wordpress.conf.j2
    dest: "{{ apache_vhost_file }}"
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts.os_family == 'Debian'
  notify: Restart Apache

- name: Enable WordPress site on Debian
  ansible.builtin.file:
    src: "{{ apache_vhost_file }}"
    dest: /etc/apache2/sites-enabled/wordpress.conf
    state: link
  when: ansible_facts.os_family == 'Debian'
  notify: Restart Apache

- name: Disable default Apache site on Debian
  ansible.builtin.file:
    path: /etc/apache2/sites-enabled/000-default.conf
    state: absent
  when: ansible_facts.os_family == 'Debian'
  notify: Restart Apache

- name: Configure Apache on RedHat
  ansible.builtin.template:
    src: wordpress.conf.j2
    dest: "{{ apache_vhost_file }}"
    owner: root
    group: root
    mode: '0644'
  when: ansible_facts.os_family == 'RedHat'
  notify: Restart Apache

- name: Enable Apache database network access on RedHat
  ansible.builtin.command:
    cmd: setsebool -P httpd_can_network_connect_db 1
  when: ansible_facts.os_family == 'RedHat'

- name: Remove temporary WordPress archive
  ansible.builtin.file:
    path: /tmp/wordpress.tar.gz
    state: absent
