apiVersion: v1
kind: Service
metadata:
  name: {{ include "wordpress.mysqlServiceName" . }}
  labels:
    {{- include "wordpress.mysqlLabels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: mysql
      port: {{ .Values.mysql.service.port }}
      targetPort: mysql
  selector:
    {{- include "wordpress.mysqlSelectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "wordpress.fullname" . }}-mysql
  labels:
    {{- include "wordpress.mysqlLabels" . | nindent 4 }}
spec:
  serviceName: {{ include "wordpress.mysqlServiceName" . }}
  replicas: {{ .Values.mysql.replicas }}
  selector:
    matchLabels:
      {{- include "wordpress.mysqlSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wordpress.mysqlSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.mysql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mysql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mysql.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mysql
          image: "{{ .Values.images.mysql.repository }}:{{ .Values.images.mysql.tag }}"
          imagePullPolicy: {{ .Values.images.mysql.pullPolicy }}
          ports:
            - name: mysql
              containerPort: {{ .Values.mysql.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "wordpress.mysqlConfigName" . }}
            - secretRef:
                name: {{ include "wordpress.mysqlSecretName" . }}
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: mysql-data
        labels:
          {{- include "wordpress.mysqlSelectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.mysql.persistence.accessModes | nindent 10 }}
        storageClassName: {{ include "wordpress.storageClassName" . }}
        selector:
          matchLabels:
            {{- include "wordpress.mysqlSelectorLabels" . | nindent 12 }}
        resources:
          requests:
            storage: {{ .Values.mysql.persistence.size }}
