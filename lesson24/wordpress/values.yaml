nameOverride: ""
fullnameOverride: ""

images:
  mysql:
    repository: mysql
    tag: "8.0"
    pullPolicy: IfNotPresent
  wordpress:
    repository: wordpress
    tag: latest
    pullPolicy: IfNotPresent

database:
  name: wordpress
  user: wordpress

secrets:
  mysqlRootPassword: root_password
  databasePassword: wordpress_password

storageClass:
  create: true
  name: ""
  provisioner: kubernetes.io/no-provisioner
  volumeBindingMode: WaitForFirstConsumer
  reclaimPolicy: Retain

mysql:
  replicas: 1
  service:
    port: 3306
  nodeSelector:
    kubernetes.io/hostname: kube-control
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  affinity: {}
  persistence:
    enabled: true
    createPV: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
    hostPath: /srv/k8s/lesson24/mysql
    reclaimPolicy: Retain
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

wordpress:
  replicas: 1
  service:
    type: ClusterIP
    port: 80
  nodeSelector:
    kubernetes.io/hostname: kube-worker
  tolerations: []
  affinity: {}
  persistence:
    enabled: true
    createPV: true
    size: 5Gi
    accessModes:
      - ReadWriteOnce
    storageClassName: ""
    hostPath: /srv/k8s/lesson24/wordpress
    reclaimPolicy: Retain
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 50

networkPolicy:
  enabled: true

ingress:
  enabled: true
  className: nginx
  annotations: {}
  hosts:
    - host: wordpress.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
