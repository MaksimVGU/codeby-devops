apiVersion: v1
kind: ServiceAccount
metadata:
  name: wordpress-diagnostic
  namespace: dev
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: wordpress-diagnostic
  namespace: dev
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: wordpress-diagnostic
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: wordpress-diagnostic
    namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: wordpress-diagnostic
